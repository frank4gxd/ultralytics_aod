# yolov10n-aod.yaml
task: detect

# Parameters
nc: 1
scales:
  n: [0.33, 0.25, 1024]

backbone:
  # [from, repeats, module, args]
  - [ -1, 1, AODImage, [ 3, 3, true, 0.0, 1.0, false ] ]  # c1=3, c2=3, residual, clamp_lo, clamp_hi, detach
  - [ -1, 1, Conv,     [ 64, 3, 2 ] ]
  - [-1, 1, Conv,     [128, 3, 2]]               # 2 P2/4
  - [-1, 3, C2f,      [128, true]]               # 3
  - [-1, 1, Conv,     [256, 3, 2]]               # 4 P3/8
  - [-1, 6, C2f,      [256, true]]               # 5
  - [-1, 1, SCDown,   [512, 3, 2]]               # 6 P4/16
  - [-1, 6, C2f,      [512, true]]               # 7
  - [-1, 1, SCDown,   [1024, 3, 2]]              # 8 P5/32
  - [-1, 3, C2f,      [1024, true]]              # 9
  - [-1, 1, SPPF,     [1024, 5]]                 # 10
  - [-1, 1, PSA,      [1024]]                    # 11

head:
  - [-1, 1, AODFeat, [256, true, "gn", 0, false]]   # c2=256, residual, norm, bottleneck, detach
  - [-1, 1, nn.Upsample, [null, 2, "nearest"]]   # 12
  - [[-1, 7], 1, Concat, [1]]                    # 13 cat P4 (layer 7)
  - [-1, 3, C2f, [512]]                          # 14

  - [-1, 1, nn.Upsample, [null, 2, "nearest"]]   # 15
  - [[-1, 5], 1, Concat, [1]]                    # 16 cat P3 (layer 5)
  - [-1, 3, C2f, [256]]                          # 17 (P3/8)

  - [-1, 1, Conv, [256, 3, 2]]                   # 18
  - [[-1, 14], 1, Concat, [1]]                   # 19 cat head P4
  - [-1, 3, C2f, [512]]                          # 20 (P4/16)

  - [-1, 1, SCDown, [512, 3, 2]]                 # 21
  - [[-1, 11], 1, Concat, [1]]                   # 22 cat head P5
  - [-1, 3, C2fCIB, [1024, true, true]]          # 23 (P5/32)

  - [[17, 20, 23], 1, v10Detect, [nc]]           # Detect(P3,P4,P5)
